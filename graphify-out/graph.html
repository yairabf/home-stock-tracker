ponse.dto.ts:HouseholdResponseDto", "target": "dto:HouseholdResponseDto", "type": "uses"}, {"source": "src/household/dto/household-response.dto.ts:HouseholdResponseDto", "target": "src/household/dto/household-response.dto.ts:HouseholdResponseDto::fromEntity", "type": "defines"}, {"source": "src/household/dto/household-response.dto.ts:HouseholdResponseDto", "target": "dto:HouseholdResponseDto", "type": "uses"}, {"source": "src/household/dto/household-response.dto.ts:HouseholdResponseDto", "target": "src/household/dto/household-response.dto.ts:HouseholdResponseDto::HouseholdResponseDto", "type": "defines"}, {"source": "src/household/dto/household-response.dto.ts:HouseholdResponseDto", "target": "dto:HouseholdResponseDto", "type": "uses"}];

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph")
            .attr("viewBox", [0, 0, width, height]);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(20));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        const node = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.type === 'service' || d.type === 'controller' ? 8 : 5)
            .attr("fill", d => d.color)
            .attr("stroke", d => d.color);

        node.append("text")
            .text(d => d.label)
            .attr("x", 10)
            .attr("y", 4)
            .attr("opacity", 0.8);

        // Tooltip
        const tooltip = d3.select("#tooltip");
        node.on("mouseover", function(event, d) {
            tooltip.style("opacity", 1)
                .html(`<strong>${d.label}</strong><br/>Type: ${d.type}<br/>File: ${d.source}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", () => tooltip.style("opacity", 0));

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        // Zoom
        svg.call(d3.zoom().on("zoom", (event) => {
            svg.select("g").attr("transform", event.transform);
        }));
    </script>
