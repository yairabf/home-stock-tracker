name: Verify and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec prisma generate
      - run: npm run verify

  docker-check:
    name: Build Docker platforms
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=docker-pr
          cache-to: type=gha,mode=max,scope=docker-pr

  publish:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yairabf/home-stock-tracker'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-home-stock-tracker
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/yairabf/home-stock-tracker
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yairabf/home-stock-tracker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yairabf/home-stock-tracker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main
      - name: Check platforms and promote current main to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' manifest.json
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"
            echo 'Promoted to latest.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Commit image published; latest unchanged because main has advanced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Image: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
